# GitHub Action to build the remote-ui Qt project as a static Qt app for the Remote Two/3 and, for release builds,
# as a static Linux x64 desktop simulator. Both are built in the Docker toolchain images of
# https://github.com/unfoldedcircle/ucr2-toolchain (see docs/cross-compile.md and docs/static-compile.md).
---
name: "Build & Release"

on:
  # Only main and release tags are built on push: a feature branch is built by its pull request
  push:
    branches:
      - main
    paths:
      - '.github/**/*.yml'
      - '.gitmodules'
      - 'remote-ui.pro'
      - 'resources/**'
      - 'src/**'
      - 'test/**'
      - 'tools/**'
    tags:
      # This is not regex: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened ]
    paths:
      - '.github/**/*.yml'
      - '.gitmodules'
      - 'remote-ui.pro'
      - 'resources/**'
      - 'src/**'
      - 'test/**'
      - 'tools/**'
  # Allow a manual build from the Actions tab. Path filters don't apply to a manual run.
  workflow_dispatch:

# Avoid duplicate and superseded runs: a feature branch is only built through its pull request,
# and a new push to it cancels the previous run. Release builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege default for the job token. The release job raises it to contents: write.
permissions:
  contents: read

env:
  QT_VERSION: 5.15.2
  APP_PRO: remote-ui.pro
  APP_NAME: remote-ui
  PROJECT_NAME: remote-ui
  # Build artifact output path. Used to set project specific UC_BIN env var.
  BIN_OUTPUT_PATH: "binaries"
  DEBUG_OUTPUT: "false"
  # Use cmake shell for platform independent builds. Otherwise, it only works on Linux!
  USE_CMAKE_SHELL: "true"
  HASH_FILENAME: remote-ui.hash
  BUILD_CHANGELOG: build-changelog.md

jobs:
  unit-tests:
    name: Qt unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Cache libicu56 build
        id: cache-libicu56
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: icu
          key: libicu56-${{ matrix.config.artifact }}

      # Qt lrelease & lupdate tools require a very old libicu version which is not available on Linux!
      # Even installing the Ubuntu qt5dev (or similar) package which provides these tools is broken!!!
      - name: Build libicu56 library for lupdate
        if: runner.os == 'Linux' && steps.cache-libicu56.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/unicode-org/icu/releases/download/release-56-2/icu4c-56_2-src.tgz
          tar xzf icu4c-56_2-src.tgz
          cd icu/source
          chmod +x runConfigureICU configure install-sh
          ./runConfigureICU Linux
          make -j$(nproc)

      - name: Install libicu56 library
        if: runner.os == 'Linux'
        run: |
          cd icu/source
          sudo make install

      # Attention shared Qt installation cache: use the same configuration as for the desktop build below!
      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ env.QT_VERSION }}
          # modules & archives: https://ddalcino.github.io/aqt-list-server/
          modules: 'qtvirtualkeyboard'
          # qtbase: qmake
          # qttools: lrelease & lupdate
          archives: 'qtbase qtdeclarative qtmultimedia qtquickcontrols2 qtsvg qttools qtwebsockets'
          cache: true
          cache-key-prefix: ${{ env.QT_VERSION }}-${{ matrix.config.artifact }}

      - name: Show environment
        if: env.DEBUG_OUTPUT == 'true'
        run: |
          printenv
          ls -lah ..
          echo "Qt5_DIR directory:"
          ls -lah "$Qt5_DIR"
          echo "qmake   : $(which qmake)"
          echo "lrelease: $(which lrelease)"
          echo "lupdate : $(which lupdate)"
          qmake --version
          qmake -query

      - name: Checkout ${{ env.PROJECT_NAME }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.PROJECT_NAME }}
          submodules: recursive

      - name: Build unit tests
        shell: bash
        run: |
          mkdir ${{ env.PROJECT_NAME }}/test/build
          cd ${{ env.PROJECT_NAME }}/test/build
          cmake -D CMAKE_PREFIX_PATH="$QT_ROOT_DIR" ..
          cmake --build .

      - name: Unit tests
        shell: bash
        run: |
          cd ${{ env.PROJECT_NAME }}/test/build
          common/testCommon
          core/testCore
          hardware/testHardware
          ui/testUiModels
          hardware/testBattery

  # The static builds run in Docker toolchain images. The Linux x64 desktop simulator is only built for release
  # builds (push to main and version tags), not for pull requests, so the matrix is computed here.
  build-matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.matrix.outputs.config }}
    steps:
      - name: Select the static build targets
        id: matrix
        shell: bash
        run: |
          UCR2='{ "name": "UCR2 aarch64", "artifact": "UCR2", "build": "static", "output": "linux-arm64/release",
                  "build-image": "unfoldedcircle/r2-toolchain-qt-5.15.8-static", "changelog": true }'
          LINUX_X64='{ "name": "Linux x64 desktop", "artifact": "Linux-x64", "build": "static", "output": "linux-x64/release",
                       "build-image": "unfoldedcircle/remote-ui-toolchain-qt-5.15.19-static-x64", "changelog": false }'
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ]]; then
            CONFIG="[$UCR2, $LINUX_X64]"
          else
            CONFIG="[$UCR2]"
          fi
          echo "config=$(echo "$CONFIG" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "$CONFIG"

  build-static:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    needs: [unit-tests, build-matrix]
    strategy:
      matrix:
        config: ${{ fromJSON(needs.build-matrix.outputs.config) }}
# TODO add YIO Remote support
#          - {
#            name: "YIO Remote", artifact: "YIO", build: "static",
#            build-image: ""
#          }

    steps:
      - name: Checkout ${{ env.PROJECT_NAME }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # history and tags required to determine number of commits since last release tag
          fetch-depth: 0
          path: ${{ env.PROJECT_NAME }}
          submodules: recursive

      - name: Set build output directory
        shell: bash
        run: |
          # the toolchain images write to binaries/<platform>/release (default path of remote-ui.pro, or UC_BIN)
          mkdir ${{ env.PROJECT_NAME }}/build
          mkdir ${{ env.PROJECT_NAME }}/${{env.BIN_OUTPUT_PATH }}
          echo "UC_BIN=${GITHUB_WORKSPACE}/${{ env.PROJECT_NAME }}/${BIN_OUTPUT_PATH}/${{ matrix.config.output }}" >> $GITHUB_ENV

      - name: Build in the Docker toolchain image
        run: |
          docker pull ${{ matrix.config.build-image }}
          docker run --rm  \
              --user=$(id -u):$(id -g) \
              -v ${GITHUB_WORKSPACE}/${{ env.PROJECT_NAME }}:/sources \
              ${{ matrix.config.build-image }}
      - name: Set build artifact name
        shell: bash
        run: |
          cd ${{ env.PROJECT_NAME }}
          APP_VERSION=$(git describe --match "v[0-9]*" --tags HEAD --always)
          echo "App version: $APP_VERSION"
          echo "$APP_VERSION" > ${{ env.UC_BIN }}/version.txt
          echo "ARTIFACT_NAME=${{ env.APP_NAME }}-$APP_VERSION-${{ matrix.config.artifact }}-${{ matrix.config.build }}" >> $GITHUB_ENV

      # Archive is required to preserve file permissions and re-used for release uploads
      - name: Create upload artifact
        shell: bash
        run: |
          tar czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C ${{ env.UC_BIN }} .
          ls -lah

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      # Release notes for the release job, built from the conventional commits since the last tag.
      # Attention: artifact names must be unique, only one matrix entry may create and upload the changelog!
      - name: Setup Node.js
        if: matrix.config.changelog
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      - name: Create changelog
        if: matrix.config.changelog
        shell: bash
        run: |
          CHANGELOG="${GITHUB_WORKSPACE}/${{ env.BUILD_CHANGELOG }}"
          cd ${{ env.PROJECT_NAME }}
          npm install -g conventional-changelog-cli
          conventional-changelog -p conventionalcommits -u -o "$CHANGELOG"
          # Drop the generated title line and the blank line after it: without a package.json
          # it has no version and renders as an empty link, and action-gh-release appends the
          # GitHub generated release notes below anyway.
          sed -i -e '1{/^## \[\]/d}' -e '/./,$!d' "$CHANGELOG"
          cat "$CHANGELOG"

      - name: Upload changelog
        if: matrix.config.changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog
          path: ${{ env.BUILD_CHANGELOG }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create Release
    if: github.ref == 'refs/heads/main' || contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: [build-static]
    # required to delete the previous pre-release and to create a new release
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Extract build archives from downloaded files
        run: |
          ls -R
          # extract tar.gz build archives from downloaded artifacts
          # (wrapped in tar from actions/upload-artifact, then extracted into a directory by actions/download-artifact)
          for D in *
            do if [ -d "${D}" ]; then
              mv $D/* ./
            fi
          done;

      # Use a common timestamp for all matrix build artifacts
      - name: Get timestamp
        run: |
          echo "TIMESTAMP=$(date +"%Y%m%d_%H%M%S")" >> $GITHUB_ENV

      # Checkout is required for the `gh release delete` step to resolve the repository
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main

      # softprops/action-gh-release only appends assets to an existing release, so the previous
      # "latest" pre-release has to go first. This replicates marvinpinto/action-automatic-releases.
      - name: Remove previous pre-release
        if: "!contains(github.ref, 'tags/v')"
        run: |
          cd main
          gh release delete latest --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}

      # Add timestamp to development builds
      - name: Create GitHub development build archives
        if: "!contains(github.ref, 'tags/v')"
        run: |
          # append timestamp
          for filename in *.tar.gz; do mv $filename "$(basename $filename .tar.gz)-${{ env.TIMESTAMP }}.tar.gz"; done;
          for filename in *.tar.gz; do echo "sha256  `sha256sum $filename`" >> ${{ env.HASH_FILENAME }}; done;

      # Use the conventional commit changelog and append the GitHub generated release notes
      - name: Create Pre-Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: "!contains(github.ref, 'tags/v')"
        with:
          prerelease: true
          tag_name: latest
          name: "Development Build"
          body_path: ${{ env.BUILD_CHANGELOG }}
          generate_release_notes: true
          files: |
            *.tar.gz
            ${{ env.HASH_FILENAME }}

      - name: Create GitHub release archives
        if: "contains(github.ref, 'tags/v')"
        run: |
          for filename in *.tar.gz; do echo "sha256  `sha256sum $filename`" >> ${{ env.HASH_FILENAME }}; done;

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: "contains(github.ref, 'tags/v')"
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            *.tar.gz
            ${{ env.HASH_FILENAME }}
