# GitHub Action that verifies C++ source compliance with cpplint

name: Code Guidelines
on:
  # Only main is checked on push: a feature branch is checked by its pull request
  push:
    branches:
      - main
    paths:
      - .github/workflows/code_guidelines.yml
      - src/**.cpp
      - src/**.h
  pull_request:
    paths:
      - .github/workflows/code_guidelines.yml
      - src/**.cpp
      - src/**.h
  # Allow a manual run from the Actions tab. Path filters don't apply to a manual run.
  workflow_dispatch:

# Avoid duplicate and superseded runs: a feature branch is only checked through its pull
# request, and a new push to it cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege default for the job token.
permissions:
  contents: read

jobs:
  cpplint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install cpplint
      - name: cpplint
        shell: python
        run: |
          import os
          import re
          import subprocess
          import sys
          import glob

          print("Python {}.{}.{}".format(*sys.version_info))

          print("cpplint:")
          result = subprocess.run(["cpplint", "--filter=-build/include_subdir,-build/c++11,-whitespace", "--linelength=120", "--root=src", "--recursive", "src"], text=True)
          if result.returncode:
            sys.exit(result.returncode)

          source_files = glob.glob('src/**/*.*', recursive=True)
          cpp_exts = tuple(".c .c++ .cc .cpp .cu .cuh .cxx .h .h++ .hh .hpp .hxx".split())
          cpp_files = [file for file in source_files if file.lower().endswith(cpp_exts)]
          print(f"{len(cpp_files)} C++ files were found.")

          space_files = [file for file in cpp_files if " " in file]
          if space_files:
            print(f"{len(space_files)} files contain space character:")
            print("\n".join(space_files) + "\n")

          bad_files = len(space_files)
          if bad_files:
            sys.exit(bad_files)
